<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | UniRide</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <header class="marca">
        <h1>Uni<span>Ride</span></h1>
        <p>Caronas entre estudantes da PUC-Campinas</p>
    </header>

    <!-- Tela provisória pós-login. Será substituída pelas telas de perfil e caronas (E2+). -->
    <section class="cartao">
        <h2 id="saudacao">Carregando...</h2>

        <ul class="dados-usuario">
            <li><span>Nome</span><span id="dado-nome">-</span></li>
            <li><span>E-mail</span><span id="dado-email">-</span></li>
            <li><span>RA</span><span id="dado-ra">-</span></li>
        </ul>

        <button type="button" class="botao secundario" id="botao-sair">Sair</button>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/inicio.js"></script>
</body>
</html>
