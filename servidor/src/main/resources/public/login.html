<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | UniRide</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <header class="marca">
        <h1>Uni<span>Ride</span></h1>
        <p>Caronas entre estudantes da PUC-Campinas</p>
    </header>

    <section class="cartao">
        <h2>Entrar</h2>

        <div id="alerta" class="alerta" role="alert"></div>

        <form id="form-login" novalidate>
            <div class="campo">
                <label for="email">E-mail institucional</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="seu.nome@puccampinas.edu.br" required>
                <div class="erro-campo"></div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                <div class="erro-campo"></div>
            </div>

            <button type="submit" class="botao" id="botao-entrar">Entrar</button>
        </form>

        <p class="rodape">Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a></p>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
