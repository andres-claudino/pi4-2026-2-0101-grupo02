<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | UniRide</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <header class="marca">
        <h1>Uni<span>Ride</span></h1>
        <p>Caronas entre estudantes da PUC-Campinas</p>
    </header>

    <section class="cartao">
        <h2>Criar conta</h2>

        <div id="alerta" class="alerta" role="alert"></div>

        <form id="form-cadastro" novalidate>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" autocomplete="name" maxlength="100" required>
                <div class="erro-campo"></div>
            </div>

            <div class="campo">
                <label for="email">E-mail institucional</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="seu.nome@puccampinas.edu.br" required>
                <div class="erro-campo"></div>
            </div>

            <div class="campo">
                <label for="ra">RA (matrícula)</label>
                <input type="text" id="ra" name="ra" inputmode="numeric" maxlength="12" required>
                <div class="erro-campo"></div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="new-password" maxlength="72" required>
                <div class="dica">Mínimo de 8 caracteres, com pelo menos uma letra e um número.</div>
                <div class="erro-campo"></div>
            </div>

            <div class="campo">
                <label for="confirmacao">Confirmar senha</label>
                <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" maxlength="72" required>
                <div class="erro-campo"></div>
            </div>

            <button type="submit" class="botao" id="botao-cadastrar">Criar conta</button>
        </form>

        <p class="rodape">Já tem conta? <a href="/login.html">Entrar</a></p>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/cadastro.js"></script>
</body>
</html>
